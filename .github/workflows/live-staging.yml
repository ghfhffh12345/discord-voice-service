name: Live Staging

on:
  workflow_dispatch:
    inputs:
      discord_voice_service_image_ref:
        description: Optional override for the discord-voice-service candidate image ref used during this run
        required: false
        type: string
      discord_voice_service_image_digest:
        description: Optional expected digest for the discord-voice-service candidate image ref
        required: false
        type: string
      ytmusic_service_image_ref:
        description: Optional override for the ytmusic-service image ref used during this run
        required: false
        type: string
  workflow_call:
    inputs:
      source_ref:
        description: Git ref to validate from a caller workflow
        required: false
        type: string
      source_sha:
        description: Commit SHA expected for the validated source ref
        required: false
        type: string
      discord_voice_service_image_ref:
        description: Candidate discord-voice-service image ref to validate in the protected staging environment
        required: true
        type: string
      discord_voice_service_image_digest:
        description: Optional expected digest for the candidate discord-voice-service image ref
        required: false
        type: string
      ytmusic_service_image_ref:
        description: Optional override for the ytmusic-service image ref used during this run
        required: false
        type: string

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  TEST_GUILD_ID: ${{ secrets.TEST_GUILD_ID }}
  TEST_VOICE_CHANNEL_ID: ${{ secrets.TEST_VOICE_CHANNEL_ID }}
  TEST_VIDEO_ID: ${{ secrets.TEST_VIDEO_ID }}
  DISCORD_VOICE_SERVICE_URI: http://127.0.0.1:55051
  DISCORD_VOICE_SERVICE_BIND_ADDR: 127.0.0.1:55051
  DISCORD_VOICE_SERVICE_YTMUSIC_ADDR: http://127.0.0.1:50051
  BROWSER_JSON_SOURCE_PATH: ${{ vars.STAGING_BROWSER_JSON_SOURCE_PATH }}
  REQUESTED_DISCORD_VOICE_SERVICE_IMAGE_REF: ${{ inputs.discord_voice_service_image_ref }}
  REQUESTED_DISCORD_VOICE_SERVICE_IMAGE_DIGEST: ${{ inputs.discord_voice_service_image_digest }}
  CONFIGURED_YTMUSIC_SERVICE_IMAGE_REF: ${{ vars.YTMUSIC_SERVICE_IMAGE_REF }}
  REQUESTED_YTMUSIC_SERVICE_IMAGE_REF: ${{ inputs.ytmusic_service_image_ref }}
  DEFAULT_YTMUSIC_SERVICE_IMAGE_REF: ghcr.io/ghfhffh12345/ytmusic-service:latest
  YTMUSIC_SERVICE_PUBLIC_ADDR: 0.0.0.0:50051
  YTMUSIC_SERVICE_ADMIN_ADDR: 0.0.0.0:50052
  YTMUSIC_SERVICE_BROWSER_JSON: /run/secrets/browser.json

concurrency:
  group: live-staging-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false

jobs:
  live-staging:
    name: Live Discord Staging Validation
    runs-on:
      - self-hosted
      - linux
      - discord-voice-staging
    timeout-minutes: 45
    environment: live-staging

    steps:
      - name: Resolve validation target
        id: source
        shell: bash
        env:
          WORKFLOW_CALL_SOURCE_REF: ${{ inputs.source_ref }}
          WORKFLOW_CALL_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          checkout_ref="${WORKFLOW_CALL_SOURCE_REF:-${GITHUB_REF}}"
          source_sha="${WORKFLOW_CALL_SOURCE_SHA:-${GITHUB_SHA}}"
          trigger_mode="${GITHUB_EVENT_NAME}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_call" ]]; then
            trigger_mode="workflow_call"
          fi

          {
            echo "checkout_ref=${checkout_ref}"
            echo "source_sha=${source_sha}"
            echo "trigger_mode=${trigger_mode}"
          } >> "${GITHUB_OUTPUT}"

      # actions/checkout@v5 is a JavaScript action that runs on Node 24 before any shell
      # prerequisite checks. The self-hosted runner must already support Node 24-backed
      # GitHub Actions execution for this workflow to start at all.
      - name: Check out requested ref
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.checkout_ref }}

      - name: Resolve discord-voice-service image ref
        shell: bash
        run: |
          set -euo pipefail

          service_image_ref="${REQUESTED_DISCORD_VOICE_SERVICE_IMAGE_REF:-${DISCORD_VOICE_SERVICE_IMAGE_REF:-}}"
          if [[ -z "${service_image_ref}" ]]; then
            echo "::error::Provide discord_voice_service_image_ref for this validation run or set DISCORD_VOICE_SERVICE_IMAGE_REF on the self-hosted runner"
            exit 1
          fi

          echo "DISCORD_VOICE_SERVICE_IMAGE_REF=${service_image_ref}" >> "${GITHUB_ENV}"

          if [[ -n "${REQUESTED_DISCORD_VOICE_SERVICE_IMAGE_DIGEST:-}" ]]; then
            echo "DISCORD_VOICE_SERVICE_IMAGE_DIGEST=${REQUESTED_DISCORD_VOICE_SERVICE_IMAGE_DIGEST}" >> "${GITHUB_ENV}"
          fi

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Validate runner prerequisites and required inputs
        shell: bash
        run: ./scripts/ci/live_staging_preflight.sh

      - name: Resolve ytmusic image ref
        shell: bash
        run: |
          set -euo pipefail

          ytmusic_image_ref="${REQUESTED_YTMUSIC_SERVICE_IMAGE_REF:-}"
          if [[ -z "${ytmusic_image_ref}" ]]; then
            ytmusic_image_ref="${CONFIGURED_YTMUSIC_SERVICE_IMAGE_REF:-${YTMUSIC_SERVICE_IMAGE_REF:-}}"
          fi
          if [[ -z "${ytmusic_image_ref}" ]]; then
            ytmusic_image_ref="${DEFAULT_YTMUSIC_SERVICE_IMAGE_REF}"
          fi

          echo "YTMUSIC_SERVICE_IMAGE_REF=${ytmusic_image_ref}" >> "${GITHUB_ENV}"

      - name: Run live staging validation
        shell: bash
        run: ./scripts/ci/run_live_staging.sh

      - name: Summarize staging validation mode
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## Live staging validation"
            echo
            echo "- Trigger: \`${{ steps.source.outputs.trigger_mode }}\`"
            echo "- Protected environment: \`live-staging\`"
            echo "- Validation target for \`discord-voice-service\`: requested candidate image ref \`${DISCORD_VOICE_SERVICE_IMAGE_REF:-not resolved}\`"
            echo "- Resolved artifact ref: \`${DISCORD_VOICE_SERVICE_RESOLVED_IMAGE_REF:-not resolved}\`"
            echo "- Candidate digest check: \`${DISCORD_VOICE_SERVICE_IMAGE_DIGEST:-not requested}\`"
            echo "- Source ref: \`${{ steps.source.outputs.checkout_ref }}\`"
            echo "- Source commit: \`${{ steps.source.outputs.source_sha }}\`"
            echo "- ytmusic-service image ref: \`${YTMUSIC_SERVICE_IMAGE_REF:-not resolved}\`"
            echo "- browser.json source path provider: \`BROWSER_JSON_SOURCE_PATH\` or \`STAGING_BROWSER_JSON_SOURCE_PATH\`"
          } >> "${GITHUB_STEP_SUMMARY}"
