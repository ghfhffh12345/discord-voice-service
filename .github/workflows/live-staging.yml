name: Live Staging

on:
  workflow_dispatch:
    inputs:
      ytmusic_service_image_ref:
        description: Optional override for the ytmusic-service image ref used during this run
        required: false
        type: string
  workflow_run:
    workflows:
      - Release Image
    types:
      - completed

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  TEST_GUILD_ID: ${{ secrets.TEST_GUILD_ID }}
  TEST_VOICE_CHANNEL_ID: ${{ secrets.TEST_VOICE_CHANNEL_ID }}
  TEST_VIDEO_ID: ${{ secrets.TEST_VIDEO_ID }}
  DISCORD_VOICE_SERVICE_ADDR: http://127.0.0.1:55051
  DISCORD_VOICE_SERVICE_YTMUSIC_ADDR: http://127.0.0.1:50051
  DISCORD_VOICE_SERVICE_BIND_ADDR: 127.0.0.1:55051
  BROWSER_JSON_SOURCE_PATH: ${{ vars.STAGING_BROWSER_JSON_SOURCE_PATH }}
  CONFIGURED_YTMUSIC_SERVICE_IMAGE_REF: ${{ vars.YTMUSIC_SERVICE_IMAGE_REF }}
  WORKFLOW_DISPATCH_YTMUSIC_SERVICE_IMAGE_REF: ${{ github.event.inputs.ytmusic_service_image_ref }}
  DEFAULT_YTMUSIC_SERVICE_IMAGE_REF: ghcr.io/ghfhffh12345/ytmusic-service:latest
  YTMUSIC_SERVICE_PUBLIC_ADDR: 0.0.0.0:50051
  YTMUSIC_SERVICE_ADMIN_ADDR: 0.0.0.0:50052
  YTMUSIC_SERVICE_BROWSER_JSON: /run/secrets/browser.json

jobs:
  live-staging:
    name: Live Discord Staging Validation
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on:
      - self-hosted
      - linux
      - discord-voice-staging
    timeout-minutes: 45

    steps:
      # actions/checkout@v5 is a JavaScript action that runs on Node 24 before any shell
      # prerequisite checks. The self-hosted runner must already support Node 24-backed
      # GitHub Actions execution for this workflow to start at all.
      - name: Check out triggering workflow commit
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Manual runs still validate the checked-out source build on the staging runner.
      - name: Check out requested ref
        if: ${{ github.event_name != 'workflow_run' }}
        uses: actions/checkout@v5

      - name: Validate runner prerequisites and required inputs
        shell: bash
        run: |
          set -euo pipefail

          command -v podman >/dev/null 2>&1 || {
            echo "::error::podman must already be installed on the self-hosted staging runner"
            exit 1
          }
          command -v cargo >/dev/null 2>&1 || {
            echo "::error::cargo must already be installed on the self-hosted staging runner"
            exit 1
          }
          command -v rustc >/dev/null 2>&1 || {
            echo "::error::rustc must already be installed on the self-hosted staging runner"
            exit 1
          }

          browser_json_source_path="${BROWSER_JSON_SOURCE_PATH:-${STAGING_BROWSER_JSON_SOURCE_PATH:-}}"
          if [[ -z "${browser_json_source_path}" ]]; then
            echo "::error::Set STAGING_BROWSER_JSON_SOURCE_PATH as a repository variable or runner environment variable to a browser.json path outside the workspace"
            exit 1
          fi

          test -f "${browser_json_source_path}" || {
            echo "::error::browser.json source path does not exist: ${browser_json_source_path}"
            exit 1
          }

          for required_var in \
            APPLICATION_ID \
            BOT_TOKEN \
            TEST_GUILD_ID \
            TEST_VOICE_CHANNEL_ID \
            TEST_VIDEO_ID \
            DISCORD_VOICE_SERVICE_ADDR \
            DISCORD_VOICE_SERVICE_YTMUSIC_ADDR
          do
            if [[ -z "${!required_var:-}" ]]; then
              echo "::error::${required_var} is required for live staging validation"
              exit 1
            fi
          done

          podman --version
          cargo --version
          rustc --version

      - name: Stage browser.json into workspace
        shell: bash
        run: |
          set -euo pipefail

          browser_json_source_path="${BROWSER_JSON_SOURCE_PATH:-${STAGING_BROWSER_JSON_SOURCE_PATH:-}}"
          install -m 600 "${browser_json_source_path}" "${GITHUB_WORKSPACE}/browser.json"

      - name: Resolve ytmusic image ref
        shell: bash
        run: |
          set -euo pipefail

          ytmusic_image_ref="${WORKFLOW_DISPATCH_YTMUSIC_SERVICE_IMAGE_REF:-}"
          if [[ -z "${ytmusic_image_ref}" ]]; then
            ytmusic_image_ref="${CONFIGURED_YTMUSIC_SERVICE_IMAGE_REF:-${YTMUSIC_SERVICE_IMAGE_REF:-}}"
          fi
          if [[ -z "${ytmusic_image_ref}" ]]; then
            ytmusic_image_ref="${DEFAULT_YTMUSIC_SERVICE_IMAGE_REF}"
          fi

          echo "YTMUSIC_SERVICE_IMAGE_REF=${ytmusic_image_ref}" >> "${GITHUB_ENV}"

      - name: Build local binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --bins

      - name: Run live staging validation
        shell: bash
        run: |
          set -euo pipefail

          service_log="${RUNNER_TEMP}/discord-voice-service-live-staging.log"
          controller_log="${RUNNER_TEMP}/staging-live-check.log"
          service_binary="${GITHUB_WORKSPACE}/target/debug/discord-voice-service"
          controller_binary="${GITHUB_WORKSPACE}/target/debug/staging_live_check"

          wait_for_port() {
            local port="$1"
            local label="$2"
            local attempts="${3:-60}"

            for _ in $(seq 1 "${attempts}"); do
              if bash -lc "</dev/tcp/127.0.0.1/${port}" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done

            echo "::error::Timed out waiting for ${label} on 127.0.0.1:${port}"
            return 1
          }

          cleanup() {
            local status=$?

            if [[ "${status}" -ne 0 ]]; then
              if [[ -f "${service_log}" ]]; then
                echo "::group::discord-voice-service log"
                tail -n 200 "${service_log}" || true
                echo "::endgroup::"
              fi
              if [[ -f "${controller_log}" ]]; then
                echo "::group::staging_live_check log"
                tail -n 200 "${controller_log}" || true
                echo "::endgroup::"
              fi

              echo "::group::ytmusic-service log"
              podman logs ytmusic-service-live-staging || true
              echo "::endgroup::"
            fi

            if [[ -n "${service_pid:-}" ]] && kill -0 "${service_pid}" >/dev/null 2>&1; then
              kill "${service_pid}" >/dev/null 2>&1 || true
              wait "${service_pid}" >/dev/null 2>&1 || true
            fi

            podman rm -f ytmusic-service-live-staging >/dev/null 2>&1 || true
            rm -f "${GITHUB_WORKSPACE}/browser.json"
          }

          trap cleanup EXIT

          podman rm -f ytmusic-service-live-staging >/dev/null 2>&1 || true
          podman run -d \
            --name ytmusic-service-live-staging \
            -p 50051:50051 \
            -p 50052:50052 \
            -e YTMUSIC_SERVICE_PUBLIC_ADDR="${YTMUSIC_SERVICE_PUBLIC_ADDR}" \
            -e YTMUSIC_SERVICE_ADMIN_ADDR="${YTMUSIC_SERVICE_ADMIN_ADDR}" \
            -e YTMUSIC_SERVICE_BROWSER_JSON="${YTMUSIC_SERVICE_BROWSER_JSON}" \
            -v "${GITHUB_WORKSPACE}/browser.json:${YTMUSIC_SERVICE_BROWSER_JSON}:ro,Z" \
            "${YTMUSIC_SERVICE_IMAGE_REF}"

          wait_for_port 50051 "ytmusic-service public gRPC listener"

          DISCORD_VOICE_SERVICE_ADDR="${DISCORD_VOICE_SERVICE_BIND_ADDR}" \
            "${service_binary}" >"${service_log}" 2>&1 &
          service_pid=$!

          wait_for_port 55051 "discord-voice-service gRPC listener"
          sleep 5

          "${controller_binary}" >"${controller_log}" 2>&1

      - name: Summarize staging validation mode
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## Live staging validation"
            echo
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
            echo "- Validation target for \`discord-voice-service\`: checked-out source build on the self-hosted runner, not the published GHCR image"
            echo "- Triggering ref:"
            if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
              echo "  - source commit: \`${{ github.event.workflow_run.head_sha }}\`"
            else
              echo "  - source ref: \`${GITHUB_REF}\`"
            fi
            echo "- ytmusic-service image ref: \`${YTMUSIC_SERVICE_IMAGE_REF}\`"
            echo "- browser.json source path provider: repository variable or runner environment variable \`STAGING_BROWSER_JSON_SOURCE_PATH\`"
          } >> "${GITHUB_STEP_SUMMARY}"
