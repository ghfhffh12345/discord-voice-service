name: Release Image

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-image-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release Metadata
    runs-on: ubuntu-24.04
    outputs:
      release_ref: ${{ steps.meta.outputs.release_ref }}
      release_sha: ${{ steps.meta.outputs.release_sha }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
      candidate_tag: ${{ steps.meta.outputs.candidate_tag }}
      final_tags: ${{ steps.meta.outputs.final_tags }}
      version_tag: ${{ steps.meta.outputs.version_tag }}
      oci_labels: ${{ steps.meta.outputs.oci_labels }}
      image_annotations: ${{ steps.meta.outputs.image_annotations }}
      oci_annotations: ${{ steps.meta.outputs.oci_annotations }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release tag and derive metadata
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          release_sha="$(git rev-list -n 1 "${RELEASE_TAG}")"
          release_ref="refs/tags/${RELEASE_TAG}"
          owner="${REPOSITORY_OWNER,,}"
          image_ref="ghcr.io/${owner}/discord-voice-service"
          candidate_tag="candidate-${release_sha}"

          if [[ "${RELEASE_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version_tag="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            final_tags="$(printf '%s\n%s\n%s\nlatest' \
              "${version_tag}" \
              "${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" \
              "${BASH_REMATCH[1]}")"
          elif [[ "${RELEASE_TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-(.+)$ ]]; then
            version_tag="${RELEASE_TAG#v}"
            final_tags="${version_tag}"
          else
            echo "Release tags must match vX.Y.Z or vX.Y.Z-suffix; received '${RELEASE_TAG}'." >&2
            exit 1
          fi

          {
            echo "release_ref=${release_ref}"
            echo "release_sha=${release_sha}"
            echo "image_ref=${image_ref}"
            echo "candidate_tag=${candidate_tag}"
            echo "version_tag=${version_tag}"
            echo "final_tags<<EOF"
            printf '%s\n' "${final_tags}"
            echo "EOF"
            echo "oci_labels<<EOF"
            echo "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.title=discord-voice-service"
            echo "org.opencontainers.image.description=Rust microservice for direct Discord Voice playback from YouTube Music streams"
            echo "org.opencontainers.image.documentation=https://github.com/${GITHUB_REPOSITORY}#readme"
            echo "org.opencontainers.image.revision=${release_sha}"
            echo "org.opencontainers.image.version=${version_tag}"
            echo "EOF"
            echo "image_annotations<<EOF"
            echo "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.title=discord-voice-service"
            echo "org.opencontainers.image.description=Rust microservice for direct Discord Voice playback from YouTube Music streams"
            echo "org.opencontainers.image.documentation=https://github.com/${GITHUB_REPOSITORY}#readme"
            echo "org.opencontainers.image.revision=${release_sha}"
            echo "org.opencontainers.image.version=${version_tag}"
            echo "EOF"
            echo "oci_annotations<<EOF"
            echo "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            echo "manifest-descriptor:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            echo "index:org.opencontainers.image.version=${version_tag}"
            echo "manifest-descriptor:org.opencontainers.image.version=${version_tag}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

  verify-fake-peer-ci:
    name: Verify Fake Peer CI Gate
    runs-on: ubuntu-24.04
    needs: prepare
    steps:
      - name: Require successful Fake Peer CI run for release commit
        uses: actions/github-script@v8
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseSha = process.env.RELEASE_SHA;
            const allowedEvents = new Set(["push", "pull_request", "merge_group"]);

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: "fake-peer-ci.yml",
              head_sha: releaseSha,
              status: "completed",
              per_page: 100,
            });

            const success = runs.find((run) =>
              run.conclusion === "success" && allowedEvents.has(run.event)
            );

            if (!success) {
              core.setFailed(
                `No successful Fake Peer CI run from push/pull_request/merge_group was found for release commit ${releaseSha}. ` +
                  "Release publishing stays blocked until the normal fake-peer gate succeeds for that commit."
              );
              return;
            }

            core.notice(
              `Fake Peer CI gate satisfied by run ${success.id} (${success.html_url}) for ${releaseSha}.`
            );

  build-amd64:
    name: Build amd64 Image
    needs: [prepare, verify-fake-peer-ci]
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build amd64 image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          provenance: false
          outputs: type=image,name=${{ needs.prepare.outputs.image_ref }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ needs.prepare.outputs.oci_labels }}
          annotations: ${{ needs.prepare.outputs.image_annotations }}

  build-arm64:
    name: Build arm64 Image
    needs: [prepare, verify-fake-peer-ci]
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build arm64 image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/arm64
          provenance: false
          outputs: type=image,name=${{ needs.prepare.outputs.image_ref }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ needs.prepare.outputs.oci_labels }}
          annotations: ${{ needs.prepare.outputs.image_annotations }}

  publish-candidate-manifest:
    name: Publish Candidate Manifest
    needs: [prepare, build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    outputs:
      candidate_ref: ${{ steps.publish.outputs.candidate_ref }}
      candidate_digest: ${{ steps.publish.outputs.candidate_digest }}
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Install skopeo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Publish candidate manifest
        id: publish
        shell: bash
        env:
          IMAGE_REF: ${{ needs.prepare.outputs.image_ref }}
          CANDIDATE_TAG: ${{ needs.prepare.outputs.candidate_tag }}
          OCI_ANNOTATIONS: ${{ needs.prepare.outputs.oci_annotations }}
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
        run: |
          set -euo pipefail

          create_args=(
            --tag "${IMAGE_REF}:${CANDIDATE_TAG}"
          )

          while IFS= read -r annotation; do
            if [[ -n "${annotation}" ]]; then
              create_args+=(--annotation "${annotation}")
            fi
          done <<< "${OCI_ANNOTATIONS}"

          create_args+=(
            "${IMAGE_REF}@${AMD64_DIGEST}"
            "${IMAGE_REF}@${ARM64_DIGEST}"
          )

          docker buildx imagetools create "${create_args[@]}"

          candidate_ref="${IMAGE_REF}:${CANDIDATE_TAG}"
          candidate_digest="$(skopeo inspect --format '{{.Digest}}' "docker://${candidate_ref}")"

          {
            echo "candidate_ref=${candidate_ref}"
            echo "candidate_digest=${candidate_digest}"
          } >> "${GITHUB_OUTPUT}"

  live-staging:
    name: Live Staging Release Gate
    needs: [prepare, publish-candidate-manifest]
    uses: ./.github/workflows/live-staging.yml
    with:
      source_ref: ${{ needs.prepare.outputs.release_ref }}
      source_sha: ${{ needs.prepare.outputs.release_sha }}
      discord_voice_service_image_ref: ${{ needs.publish-candidate-manifest.outputs.candidate_ref }}
      discord_voice_service_image_digest: ${{ needs.publish-candidate-manifest.outputs.candidate_digest }}
    secrets: inherit

  publish-release-tags:
    name: Publish Release Tags
    needs: [prepare, publish-candidate-manifest, live-staging]
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish release tags from the validated candidate digest
        shell: bash
        env:
          IMAGE_REF: ${{ needs.prepare.outputs.image_ref }}
          FINAL_TAGS: ${{ needs.prepare.outputs.final_tags }}
          CANDIDATE_DIGEST: ${{ needs.publish-candidate-manifest.outputs.candidate_digest }}
        run: |
          set -euo pipefail

          create_args=()

          while IFS= read -r tag; do
            if [[ -n "${tag}" ]]; then
              create_args+=(--tag "${IMAGE_REF}:${tag}")
            fi
          done <<< "${FINAL_TAGS}"

          create_args+=("${IMAGE_REF}@${CANDIDATE_DIGEST}")
          docker buildx imagetools create "${create_args[@]}"
