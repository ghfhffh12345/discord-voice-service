name: Release Image

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-image-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify-fake-peer-ci:
    name: Verify Fake Peer CI Gate
    runs-on: ubuntu-22.04
    outputs:
      release_ref: ${{ steps.release-target.outputs.release_ref }}
      release_sha: ${{ steps.release-target.outputs.release_sha }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve release target
        id: release-target
        shell: bash
        run: |
          set -euo pipefail

          release_ref="refs/tags/${{ github.event.release.tag_name }}"
          release_sha="$(git rev-list -n 1 "${{ github.event.release.tag_name }}")"

          {
            echo "release_ref=${release_ref}"
            echo "release_sha=${release_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Require successful Fake Peer CI run for release commit
        uses: actions/github-script@v8
        env:
          RELEASE_SHA: ${{ steps.release-target.outputs.release_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseSha = process.env.RELEASE_SHA;
            const allowedEvents = new Set(["push", "pull_request", "merge_group"]);

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: "fake-peer-ci.yml",
              head_sha: releaseSha,
              status: "completed",
              per_page: 100,
            });

            const success = runs.find((run) =>
              run.conclusion === "success" && allowedEvents.has(run.event)
            );

            if (!success) {
              core.setFailed(
                `No successful Fake Peer CI run from push/pull_request/merge_group was found for release commit ${releaseSha}. ` +
                  "Release publishing stays blocked until the normal fake-peer gate succeeds for that commit."
              );
              return;
            }

            core.notice(
              `Fake Peer CI gate satisfied by run ${success.id} (${success.html_url}) for ${releaseSha}.`
            );

  build-candidate:
    name: Build Candidate GHCR Image
    needs: verify-fake-peer-ci
    runs-on: ubuntu-22.04
    outputs:
      image_repo: ${{ steps.meta.outputs.image_repo }}
      candidate_tag: ${{ steps.meta.outputs.candidate_tag }}
      target_tags: ${{ steps.meta.outputs.target_tags }}
      candidate_digest: ${{ steps.candidate-digest.outputs.candidate_digest }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install QEMU and skopeo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user-static skopeo

      - name: Derive image metadata
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ needs.verify-fake-peer-ci.outputs.release_sha }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          owner="${REPOSITORY_OWNER,,}"
          image_name="discord-voice-service"
          registry_namespace="ghcr.io/${owner}"
          image_repo="${registry_namespace}/${image_name}"
          candidate_tag="candidate-${RELEASE_SHA}"

          release_tag="${RELEASE_TAG}"
          stripped_tag="${release_tag#v}"
          prerelease="${IS_PRERELEASE}"

          declare -a tag_candidates=()
          declare -A seen=()

          add_tag() {
            local candidate="$1"
            if [[ -n "${candidate}" && -z "${seen[$candidate]:-}" ]]; then
              tag_candidates+=("${candidate}")
              seen["$candidate"]=1
            fi
          }

          add_tag "${stripped_tag}"

          if [[ "${prerelease}" != "true" && "${stripped_tag}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            add_tag "${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            add_tag "${BASH_REMATCH[1]}"
            add_tag "latest"
          fi

          {
            echo "image_name=${image_name}"
            echo "registry_namespace=${registry_namespace}"
            echo "image_repo=${image_repo}"
            echo "candidate_tag=${candidate_tag}"
            echo "candidate_ref=${image_repo}:${candidate_tag}"
            echo "target_tags=${tag_candidates[*]}"
            echo "release_version=${stripped_tag}"
            echo "is_prerelease=${prerelease}"
            echo "oci_labels<<EOF"
            echo "org.opencontainers.image.title=discord-voice-service"
            echo "org.opencontainers.image.description=Rust microservice for direct Discord Voice playback from YouTube Music streams"
            echo "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${RELEASE_SHA}"
            echo "org.opencontainers.image.version=${stripped_tag}"
            echo "org.opencontainers.image.url=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${release_tag}"
            echo "org.opencontainers.image.documentation=https://github.com/${GITHUB_REPOSITORY}#readme"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build multi-arch candidate image manifest
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ steps.meta.outputs.image_name }}
          tags: ${{ steps.meta.outputs.candidate_tag }}
          context: .
          containerfiles: |
            ./Containerfile
          platforms: linux/amd64,linux/arm64
          oci: true
          labels: ${{ steps.meta.outputs.oci_labels }}

      - name: Push candidate image manifest to GHCR
        id: push-image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ steps.meta.outputs.registry_namespace }}

      - name: Resolve candidate digest
        id: candidate-digest
        shell: bash
        env:
          CANDIDATE_REF: ${{ steps.meta.outputs.candidate_ref }}
        run: |
          set -euo pipefail

          candidate_digest="$(skopeo inspect --format '{{.Digest}}' "docker://${CANDIDATE_REF}")"
          echo "candidate_digest=${candidate_digest}" >> "${GITHUB_OUTPUT}"

      - name: Summarize candidate image
        shell: bash
        run: |
          {
            echo "## Candidate GHCR image"
            echo
            echo "- Image repo: \`${{ steps.meta.outputs.image_repo }}\`"
            echo "- Candidate tag: \`${{ steps.meta.outputs.candidate_tag }}\`"
            echo "- Candidate digest: \`${{ steps.candidate-digest.outputs.candidate_digest }}\`"
            echo "- Promotion tags: \`${{ steps.meta.outputs.target_tags }}\`"
            echo "- Registry paths: \`${{ steps.push-image.outputs.registry-paths }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  live-staging:
    name: Live Staging Release Gate
    needs:
      - verify-fake-peer-ci
      - build-candidate
    uses: ./.github/workflows/live-staging.yml
    with:
      source_ref: ${{ needs.verify-fake-peer-ci.outputs.release_ref }}
      source_sha: ${{ needs.verify-fake-peer-ci.outputs.release_sha }}
      discord_voice_service_image_ref: ${{ needs.build-candidate.outputs.image_repo }}@${{ needs.build-candidate.outputs.candidate_digest }}
      discord_voice_service_image_digest: ${{ needs.build-candidate.outputs.candidate_digest }}
    secrets: inherit

  promote-image:
    name: Promote Validated Candidate Image
    runs-on: ubuntu-22.04
    needs:
      - verify-fake-peer-ci
      - build-candidate
      - live-staging

    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install skopeo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Log in to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Promote validated candidate digest
        shell: bash
        env:
          SOURCE_IMAGE_REPO: ${{ needs.build-candidate.outputs.image_repo }}
          SOURCE_IMAGE_DIGEST: ${{ needs.build-candidate.outputs.candidate_digest }}
          TARGET_TAGS: ${{ needs.build-candidate.outputs.target_tags }}
        run: ./scripts/ci/promote_candidate_image.sh

      - name: Summarize promoted image tags
        shell: bash
        run: |
          {
            echo "## Promoted GHCR image"
            echo
            echo "- Release commit: \`${{ needs.verify-fake-peer-ci.outputs.release_sha }}\`"
            echo "- Candidate digest: \`${{ needs.build-candidate.outputs.candidate_digest }}\`"
            echo "- Promoted tags: \`${{ needs.build-candidate.outputs.target_tags }}\`"
            echo "- Fake Peer CI: passed before promotion"
            echo "- Live staging: validated the candidate image digest in the protected self-hosted \`live-staging\` gate"
          } >> "${GITHUB_STEP_SUMMARY}"
