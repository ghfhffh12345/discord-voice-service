[package]
name = "discord-voice-service"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
bytes = "1"
futures = "0.3"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-tungstenite = "0.28"
tonic = { version = "0.12", features = ["transport"] }
tonic-health = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
webm-iterable = "0.6.4"

[build-dependencies]
cc = "1.2"
protoc-bin-vendored = "3.2.0"
tonic-build = "0.12"

[dev-dependencies]
hex = "0.4"
